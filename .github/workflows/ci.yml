name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install zero-native
        run: npm install -g zero-native

      - name: Resolve zero-native path
        id: zn
        run: echo "path=$(npm root -g)/zero-native" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: zig build frontend-build -Dzero-native-path=${{ steps.zn.outputs.path }}

      - name: Build project
        run: zig build -Dzero-native-path=${{ steps.zn.outputs.path }}

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-cache-${{ runner.os }}-

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install zero-native
        run: npm install -g zero-native

      - name: Resolve zero-native path
        id: zn
        run: echo "path=$(npm root -g)/zero-native" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run tests
        run: zig build test -Dzero-native-path=${{ steps.zn.outputs.path }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint shell scripts
        run: shellcheck scripts/bump-build.sh

      - name: Type check TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
